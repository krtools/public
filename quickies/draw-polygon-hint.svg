<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 120" width="170" height="120"
     role="img" aria-label="Click to place corners, then click the first corner to close the polygon"
     style="color:#e5e7eb" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Everything uses currentColor so the drawing inherits the tooltip's text color when inlined.
       Standalone (<img>) it falls back to the root style above. Timeline is 6s and loops:
       0.7s click P1 · 1.6s P2 · 2.5s P3 · 3.4s P4 · 4.3s click P1 again to close (blue) · fade out.
       While drawing, the placed corners + cursor form a live orange preview, like mapbox-gl-draw's active fill. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.9;0.96;1" dur="6s" repeatCount="indefinite"/>

    <!-- live preview: placed corners + the cursor as the last corner (orange while drawing) -->
    <polygon points="80,62 80,62 80,62 80,62 80,62" stroke="none" fill="#ffc861" fill-opacity="0">
      <animate attributeName="points" values="80,62 80,62 80,62 80,62 80,62;30,32 30,32 30,32 30,32 30,32;30,32 30,32 30,32 30,32 30,32;30,32 122,24 122,24 122,24 122,24;30,32 122,24 122,24 122,24 122,24;30,32 122,24 138,82 138,82 138,82;30,32 122,24 138,82 138,82 138,82;30,32 122,24 138,82 55,94 55,94;30,32 122,24 138,82 55,94 55,94;30,32 122,24 138,82 55,94 30,32;30,32 122,24 138,82 55,94 30,32;30,32 122,24 138,82 55,94 30,32" keyTimes="0;0.1;0.1333;0.25;0.2833;0.4;0.4333;0.55;0.5833;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0.32;0" keyTimes="0;0.2667;0.7167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <!-- closed polygon flashes then settles light blue -->
    <polygon points="30,32 122,24 138,82 55,94" fill="#3bb2d0" stroke="#3bb2d0" stroke-width="1.5" fill-opacity="0" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.7167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.6;0.3;0.3" keyTimes="0;0.716;0.73;0.82;1" dur="6s" repeatCount="indefinite"/>
    </polygon>

    <!-- committed edges appear one click at a time, then hand off to the blue outline on close -->
    <line x1="30" y1="32" x2="122" y2="24" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2667;0.7167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="122" y1="24" x2="138" y2="82" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4167;0.7167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="138" y1="82" x2="55" y2="94" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5667;0.7167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- rubber-band segment from the last placed corner to the cursor -->
    <line x1="30" y1="32" x2="80" y2="62" stroke-width="1.25" stroke-dasharray="3 3" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.1167;0.7167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="30;30;122;138;55" keyTimes="0;0.1167;0.2667;0.4167;0.5667" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="32;32;24;82;94" keyTimes="0;0.1167;0.2667;0.4167;0.5667" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80;30;30;122;122;138;138;55;55;30;30;30" keyTimes="0;0.1;0.1333;0.25;0.2833;0.4;0.4333;0.55;0.5833;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="62;32;32;24;24;82;82;94;94;32;32;32" keyTimes="0;0.1;0.1333;0.25;0.2833;0.4;0.4333;0.55;0.5833;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- "snap here to close" ring on the first corner while the cursor returns to it -->
    <circle cx="30" cy="32" r="7" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.62;0.68;0.71;0.74" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- placed corners -->
    <g fill="currentColor" stroke="none">
      <circle cx="30"  cy="32" r="2.5" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.1167" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="122" cy="24" r="2.5" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.2667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="138" cy="82" r="2.5" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.4167" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="55"  cy="94" r="2.5" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- click ripples: a filled flash (inherits color) plus an expanding ring with a fixed darker outline -->
    <g fill="currentColor" stroke="#4b5563">
      <g>
        <circle cx="30" cy="32" r="3" stroke="none" opacity="0">
          <animate attributeName="r" values="3;3;9;9" keyTimes="0;0.1167;0.2567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.116;0.1167;0.2567;1" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="30" cy="32" r="3" opacity="0">
          <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.1167;0.2567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="2.5;2.5;1;1" keyTimes="0;0.1167;0.2567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.116;0.1167;0.2567;1" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="122" cy="24" r="3" stroke="none" opacity="0">
          <animate attributeName="r" values="3;3;9;9" keyTimes="0;0.2667;0.4067;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.266;0.2667;0.4067;1" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="122" cy="24" r="3" opacity="0">
          <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.2667;0.4067;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="2.5;2.5;1;1" keyTimes="0;0.2667;0.4067;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.266;0.2667;0.4067;1" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="138" cy="82" r="3" stroke="none" opacity="0">
          <animate attributeName="r" values="3;3;9;9" keyTimes="0;0.4167;0.5567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.416;0.4167;0.5567;1" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="138" cy="82" r="3" opacity="0">
          <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.4167;0.5567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="2.5;2.5;1;1" keyTimes="0;0.4167;0.5567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.416;0.4167;0.5567;1" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="55" cy="94" r="3" stroke="none" opacity="0">
          <animate attributeName="r" values="3;3;9;9" keyTimes="0;0.5667;0.7067;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.566;0.5667;0.7067;1" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="55" cy="94" r="3" opacity="0">
          <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.5667;0.7067;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="2.5;2.5;1;1" keyTimes="0;0.5667;0.7067;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.566;0.5667;0.7067;1" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="30" cy="32" r="3" stroke="none" opacity="0">
          <animate attributeName="r" values="3;3;9;9" keyTimes="0;0.7167;0.8567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.716;0.7167;0.8567;1" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="30" cy="32" r="3" opacity="0">
          <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.7167;0.8567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="2.5;2.5;1;1" keyTimes="0;0.7167;0.8567;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.716;0.7167;0.8567;1" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- cursor: pauses briefly at each corner so the click reads -->
    <path d="M0 0 L0 13.5 L3.4 10.4 L5.6 15.5 L8.2 14.4 L6 9.4 L10.6 9.4 Z"
          fill="currentColor" stroke="#111827" stroke-width="0.75" stroke-linejoin="miter">
      <animateTransform attributeName="transform" type="translate"
        values="80 62;30 32;30 32;122 24;122 24;138 82;138 82;55 94;55 94;30 32;30 32;30 32"
        keyTimes="0;0.1;0.1333;0.25;0.2833;0.4;0.4333;0.55;0.5833;0.7;0.75;1"
        dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
